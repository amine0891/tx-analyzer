[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tx-analyzer"
version = "0.1.0"
description = "Pipeline local de collecte et d'analyse de toxicite d'articles"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "detoxify>=0.5,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "matplotlib>=3.9,<4",
    "pymongo>=4.10,<5",
    "pydantic-settings>=2.6,<3",
    "selenium>=4.25,<5",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
